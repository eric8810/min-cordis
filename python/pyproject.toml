[project]
name = "min-cordis"
version = "0.1.0"
description = "Minimal Cordis core for Python: context, services, plugins, fiber lifecycle, and the event bus. Ported from the trimmed TypeScript core (min-cordis)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["min_cordis"]
